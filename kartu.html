<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-gray-100">
  <!-- Langkah 1: pembungkus kartu -->
  <div class="max-w-sm rounded-lg border bg-white p-6 shadow-md">

    <!-- Langkah 2: baris avatar + teks nama -->
    <div class="flex items-center gap-4">
      <div class="flex h-16 w-16 items-center justify-center rounded-full bg-blue-500 font-bold text-white">
        AR
      </div>
      <div>
        <!-- Langkah 3: nama dan keterangan kelas -->
        <h1 class="text-xl font-bold">Ezlyn Ervy</h1>
        <p class="text-gray-600">Siswa XII RPL</p>
      </div>
    </div>

    <!-- Langkah 4: deskripsi singkat -->
    <p class="mt-4 text-gray-700">
      Suka membuat aplikasi web dan sedang belajar Laravel.
    </p>

    <!-- Tantangan: beberapa badge keahlian -->
    <div class="mt-4 flex flex-wrap gap-2">
      <span class="rounded-full bg-blue-100 px-3 py-1 text-sm text-blue-700">HTML</span>
      <span class="rounded-full bg-blue-100 px-3 py-1 text-sm text-blue-700">Tailwind</span>
      <span class="rounded-full bg-blue-100 px-3 py-1 text-sm text-blue-700">Laravel</span>
    </div>

    <!-- Langkah 5: tombol Hubungi + Tantangan: tombol kedua bergaya garis tepi -->
    <div class="mt-4 flex gap-3">
      <button class="rounded bg-blue-500 px-4 py-2 font-semibold text-white">Hubungi</button>
      <button class="rounded border border-blue-500 bg-white px-4 py-2 font-semibold text-blue-500">Lihat Profil</button>
    </div>
  </div>
</body>
</html>
